services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_use_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    environment:
      - SERVER_NAME=${APP_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_use_reverb
    restart: unless-stopped
    entrypoint:
      ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_use_queue
    restart: unless-stopped
    entrypoint: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_use_scheduler
    restart: unless-stopped
    entrypoint:
      [
        "sh",
        "-c",
        "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done",
      ]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: rent_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: rent_redis
    restart: unless-stopped

volumes:
  mysql_data:
